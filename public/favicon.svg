<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 纯粹黑曜石背景渐变 -->
    <radialGradient id="bgObsidian" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#181c2b" />
      <stop offset="45%" stop-color="#0e1019" />
      <stop offset="100%" stop-color="#05060a" />
    </radialGradient>

    <!-- 顶部高光倒角 -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
    </linearGradient>

    <!-- 专注流转环 (Pomodoro & Progress Focus Arc) -->
    <linearGradient id="focusRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 待办完成对勾 (Soaring Checkmark) 渐变 -->
    <linearGradient id="checkGrad" x1="15%" y1="85%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- 1. Apple 风格超椭圆圆角底座 (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgObsidian)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <!-- 内部精致微光内框 -->
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="url(#bevelGrad)" stroke-width="2" />

  <!-- 2. 环境氛围光晕 (极光双色柔光散射) -->
  <circle cx="210" cy="280" r="140" fill="#6366f1" opacity="0.22" filter="url(#ambientLight)" />
  <circle cx="310" cy="220" r="130" fill="#06b6d4" opacity="0.20" filter="url(#ambientLight)" />

  <!-- 3. 背景待办清单条状律动卡片 (象征高效规划与条理) -->
  <g opacity="0.32">
    <rect x="130" y="160" width="80" height="12" rx="6" fill="#6366f1" />
    <rect x="130" y="340" width="100" height="12" rx="6" fill="#38bdf8" />
  </g>

  <!-- 4. 专注与进度律动圆环 (Focus & Pomodoro Arc) -->
  <path d="M 175 335 A 125 125 0 1 1 350 320"
        fill="none"
        stroke="url(#focusRingGrad)"
        stroke-width="24"
        stroke-linecap="round"
        opacity="0.95"
        filter="url(#dropShadow)" />

  <!-- 5. 核心图腾：极速飞跃待办勾选 (Hero Aura Checkmark) -->
  <g filter="url(#dropShadow)">
    <path d="M 160 258 L 236 334 L 366 172"
          fill="none"
          stroke="url(#checkGrad)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neonGlow)" />

    <!-- 顶部高光勾勒细线，增强 3D 悬浮与玻璃晶体质感 -->
    <path d="M 166 256 L 236 326 L 360 178"
          fill="none"
          stroke="rgba(255,255,255,0.45)"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- 6. 成功与成就之星 (Achievement Sparkle Star) -->
  <g transform="translate(382, 154)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- 次级成就微光点 -->
  <circle cx="140" cy="200" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="360" cy="380" r="4.5" fill="#10b981" opacity="0.85" />
</svg>